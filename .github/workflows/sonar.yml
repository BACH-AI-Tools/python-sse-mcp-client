name: SonarQube Analysis

on:
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

# 同一个分支 / PR 又推了新提交：取消还没跑完的旧扫描，不让过时的扫描占着 Sonar 服务器
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # 缓存扫描引擎和插件：公司 Sonar 服务器出口慢，每次重新下载要 10 分钟以上；缓存后只有第一次需要下载

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sonar-home/cache
          key: sonar-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sonar-cache-${{ runner.os }}-


      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_USER_HOME: ${{ runner.temp }}/sonar-home
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=BACH-AI-Tools_python-sse-mcp-client
            -Dsonar.projectName=python-sse-mcp-client
            -Dsonar.scanner.skipJreProvisioning=true

      # Optional: Fail the build if Quality Gate fails
      # - name: SonarQube Quality Gate check
      #   uses: SonarSource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
