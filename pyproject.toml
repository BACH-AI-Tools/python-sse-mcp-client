[project]
name = "python-mcp-client-example"
version = "0.1.0"
description = "Python MCP client examples for remote servers: Streamable HTTP and SSE (Python 远程 MCP 客户端示例)"
authors = [
    { name = "Feng Rongquan", email = "kirifeng@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.1",
    "mcp>=1.24,<2",
]
keywords = ["mcp", "sse", "streamable-http", "model-context-protocol", "mcp-client", "jieba"]

[project.urls]
Homepage = "https://github.com/BACH-AI-Tools/python-sse-mcp-client"
Repository = "https://github.com/BACH-AI-Tools/python-sse-mcp-client"
Issues = "https://github.com/BACH-AI-Tools/python-sse-mcp-client/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

